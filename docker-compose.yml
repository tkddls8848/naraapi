services:

  # 자체 호스팅 PostgreSQL. 17 은 안정 라인이라 패치만 올라간다.
  postgres:
    container_name: my-postgres
    image: postgres:17-alpine
    restart: unless-stopped
    # ports 를 일부러 열지 않는다. 같은 compose 네트워크의 naraapi 만 postgres:5432 로 붙는다.
    # 호스트에서 psql 을 쓸 일이 있으면 `docker compose exec postgres psql -U <user> <db>` 를 쓴다.
    env_file:
      - ./frontend/config_files/.env.production
    volumes:
      # 데이터는 반드시 named volume 에 둔다. 컨테이너 레이어에 두면 재생성 시 날아간다.
      - postgres-data:/var/lib/postgresql/data
      # 볼륨이 빈 최초 기동에서만 실행돼 테이블을 만든다.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # $ 는 compose 가 config 시점에 치환하지 않도록 $$ 로 이스케이프한다(컨테이너 셸이 푼다).
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  naraapi:
    container_name: my-naraapi
    build:
      context: ./frontend
      dockerfile: dockerfile
    # TLS 는 앞단 프로바이더가 종단한다. 이 포트가 서비스 진입점이다.
    ports:
      - "3000:3000"
    # 시크릿은 이미지에 굽지 않고 기동 시 주입한다.
    # 배포 전에 frontend/config_files/.env.example 을 복사해 .env.production 을 만들어야 한다.
    env_file:
      - ./frontend/config_files/.env.production
    depends_on:
      # 커넥션 풀을 지연 생성하긴 하지만, DB 가 준비된 뒤에 앱을 띄우는 편이 첫 요청이 깔끔하다.
      postgres:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres-data:
