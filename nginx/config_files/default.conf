server {
    listen 80;
    listen [::]:80;
    server_name  www.naraapi.com naraapi.com;
    server_tokens off;

    location / {
      return 301 https://$host$request_uri;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {

    listen 443 ssl;
    server_name  www.naraapi.com naraapi.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/naraapi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/naraapi.com/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        # 커스텀 HTTPS 서버가 사라져 앱 컨테이너는 평문 http 로만 듣는다.
        # docker-compose 서비스명으로 내부 네트워크에서 직접 프록시한다.
        proxy_pass http://naraapi:3000;

        # https websocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

}
